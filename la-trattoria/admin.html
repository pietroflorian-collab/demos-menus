<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Administrador - La Trattoria</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6c131c', secondary: '#635e55', surface: '#fef8f3',
            'surface-container': '#f3ede8', 'on-surface': '#1d1b19', 'outline-variant': '#ddc0bf'
          },
          fontFamily: { 'display': ['Playfair Display', 'serif'], 'body': ['Literata', 'serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Literata', serif; background-color: #faf8f5; color: #1d1b19; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ddc0bf; border-radius: 9999px; }
    .scroll-container { cursor: grab; user-select: none; }
    .scroll-container:active { cursor: grabbing; }
  </style>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/ui-editorial.js"></script>
  <script type="module" src="js/admin.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%236c131c'/><text x='16' y='23' font-family='serif' font-size='20' font-weight='700' fill='white' text-anchor='middle'>T</text></svg>">
</head>


<body class="flex min-h-[100dvh] md:h-screen overflow-x-hidden md:overflow-hidden text-sm relative">

  <!-- OVERLAY LOGIN (Oculto en demo) -->
  <div id="login-overlay" class="hidden fixed inset-0 bg-[#faf8f5] z-[100] flex items-center justify-center">
    <div class="bg-white p-8 border border-[#ddc0bf] shadow-xl w-full max-w-sm">
      <div class="text-center mb-6">
        <div class="w-16 h-16 mx-auto mb-4 flex justify-center items-center">
          <span class="material-symbols-outlined text-[#6c131c] text-4xl">lock</span>
        </div>
        <h2 class="font-display text-2xl text-gray-900">Acceso Restringido</h2>
      </div>
      <form id="login-form" class="flex flex-col gap-4">
        <input type="email" id="login-email" placeholder="Correo electrónico" required class="p-3 bg-[#faf8f5] border border-[#ddc0bf] text-gray-900 focus:outline-none focus:border-[#6c131c]">
        <input type="password" id="login-pass" placeholder="Contraseña" required class="p-3 bg-[#faf8f5] border border-[#ddc0bf] text-gray-900 focus:outline-none focus:border-[#6c131c]">
        <button type="submit" id="login-btn" class="bg-[#6c131c] text-white font-display py-3 hover:bg-[#8b2b30] transition-colors">Ingresar</button>
      </form>
    </div>
  </div>

  <div id="admin-layout" class="w-full h-full flex flex-col md:flex-row flex-1">
    
    <!-- SIDEBAR (Menú Lateral Editorial) -->
    <nav class="hidden md:flex h-screen w-64 fixed left-0 top-0 bg-[#faf8f5] border-r border-[#ddc0bf] flex-col p-4 z-40">
      <div class="mb-8 px-4 py-6 text-center border-b border-[#ddc0bf]">
        <h1 id="admin-sidebar-title" class="font-display text-2xl text-[#6c131c] uppercase tracking-widest leading-tight">La Trattoria</h1>
        <p class="text-[10px] text-gray-500 uppercase tracking-widest mt-2">Gestión de Menú</p>
      </div>
      
      <!-- Botón Publicar -->
      <div class="px-2 mb-6 shrink-0">
        <button id="nav-publish-btn" class="w-full bg-[#6c131c] text-white font-display text-sm py-3 border border-[#6c131c] hover:bg-[#8b2b30] flex items-center justify-center gap-2 transition-all">
          <span class="material-symbols-outlined text-[18px]">cloud_upload</span> Publicar Menú
        </button>
      </div>

      <!-- Menú de Navegación -->
      <div class="flex-1 px-2 overflow-y-auto flex flex-col gap-2 pb-4">
        
        <div class="flex flex-col shrink-0">
          <button onclick="document.getElementById('menu-sub').classList.toggle('hidden'); this.querySelector('.chevron').classList.toggle('rotate-180');" class="w-full flex items-center justify-between px-4 py-3 hover:bg-[#f3ede8] border border-transparent hover:border-[#ddc0bf] text-left group transition-colors">
            <div class="flex items-center pointer-events-none">
              <span class="material-symbols-outlined mr-3 text-[#6c131c]">inventory_2</span>
              <span class="font-display text-gray-800 group-hover:text-[#6c131c] uppercase tracking-wider text-sm">Catálogo</span>
            </div>
            <span class="material-symbols-outlined text-gray-400 chevron transition-transform duration-200 pointer-events-none">expand_more</span>
          </button>
          <div id="menu-sub" class="hidden flex-col gap-1 pl-6 mt-1 border-l border-[#ddc0bf] ml-6">
            <button id="nav-add-btn" class="w-full flex items-center px-4 py-2 text-gray-600 hover:text-[#6c131c] text-left">
              <span class="material-symbols-outlined mr-2 text-sm">add</span><span class="text-sm">Nuevo Plato</span>
            </button>
            <button id="nav-cat-btn" class="w-full flex items-center px-4 py-2 text-gray-600 hover:text-[#6c131c] text-left">
              <span class="material-symbols-outlined mr-2 text-sm">folder_managed</span><span class="text-sm">Categorías</span>
            </button>
          </div>
        </div>

        <div class="flex flex-col shrink-0">
          <button onclick="document.getElementById('marketing-sub').classList.toggle('hidden'); this.querySelector('.chevron').classList.toggle('rotate-180');" class="w-full flex items-center justify-between px-4 py-3 hover:bg-[#f3ede8] border border-transparent hover:border-[#ddc0bf] text-left group transition-colors">
            <div class="flex items-center pointer-events-none">
              <span class="material-symbols-outlined mr-3 text-[#6c131c]">campaign</span>
              <span class="font-display text-gray-800 group-hover:text-[#6c131c] uppercase tracking-wider text-sm">Marketing</span>
            </div>
            <span class="material-symbols-outlined text-gray-400 chevron transition-transform duration-200 pointer-events-none">expand_more</span>
          </button>
          <div id="marketing-sub" class="hidden flex-col gap-1 pl-6 mt-1 border-l border-[#ddc0bf] ml-6">
            <button id="nav-promo-btn" class="w-full flex items-center px-4 py-2 text-gray-600 hover:text-[#6c131c] text-left">
              <span class="material-symbols-outlined mr-2 text-sm">loyalty</span><span class="text-sm">Banner Promo</span>
            </button>
            <button id="nav-qr-btn" class="w-full flex items-center px-4 py-2 text-gray-600 hover:text-[#6c131c] text-left">
              <span class="material-symbols-outlined mr-2 text-sm">qr_code_2</span><span class="text-sm">Generar QR</span>
            </button>
          </div>
        </div>

        <div class="flex flex-col shrink-0">
          <button onclick="document.getElementById('admin-sub').classList.toggle('hidden'); this.querySelector('.chevron').classList.toggle('rotate-180');" class="w-full flex items-center justify-between px-4 py-3 hover:bg-[#f3ede8] border border-transparent hover:border-[#ddc0bf] text-left group transition-colors">
            <div class="flex items-center pointer-events-none">
              <span class="material-symbols-outlined mr-3 text-[#6c131c]">admin_panel_settings</span>
              <span class="font-display text-gray-800 group-hover:text-[#6c131c] uppercase tracking-wider text-sm">Sistema</span>
            </div>
            <span class="material-symbols-outlined text-gray-400 chevron transition-transform duration-200 pointer-events-none">expand_more</span>
          </button>
          <div id="admin-sub" class="hidden flex-col gap-1 pl-6 mt-1 border-l border-[#ddc0bf] ml-6">
            <a class="w-full flex items-center px-4 py-2 text-gray-600 hover:text-[#6c131c] text-left" href="index.html?admin=true" target="_blank">
              <span class="material-symbols-outlined mr-2 text-sm">storefront</span><span class="text-sm">Ver Carta</span>
            </a>
          </div>
        </div>
        
        <button id="nav-logout-btn" class="w-full flex items-center px-4 py-3 mt-auto text-red-700 hover:bg-red-50 text-left transition-colors shrink-0">
          <span class="material-symbols-outlined mr-3">logout</span><span class="font-display uppercase tracking-wider text-sm">Cerrar Sesión</span>
        </button>
      </div>
    </nav>

    <!-- ÁREA CENTRAL -->
    <main class="flex-1 ml-0 md:ml-64 flex flex-col relative z-10 min-w-0">
      
      <!-- Header -->
      <header class="px-8 py-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 shrink-0 border-b border-[#ddc0bf]">
        <div>
          <h2 class="font-display text-3xl text-[#6c131c] tracking-widest uppercase">La Carta</h2>
          <p class="text-gray-500 mt-1 italic">Administra tus recetas y productos.</p>
        </div>
        <div class="flex items-center gap-4 w-full md:w-auto">
          <div class="relative w-full sm:w-80">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</span>
            <input id="admin-search-input" class="w-full bg-white border border-[#ddc0bf] pl-10 pr-4 py-2 text-gray-900 placeholder-gray-400 focus:outline-none focus:border-[#6c131c] text-sm" placeholder="Buscar por nombre..." type="text"/>
          </div>
        </div>
      </header>

      <!-- GRILLA DE PRODUCTOS -->
      <div class="flex-1 md:overflow-y-auto px-8 pb-12 min-h-0 w-full bg-[#fef8f3]">
        <!-- Categorías (Textos con guiones) -->
        <div id="admin-category-bar" class="scroll-container flex gap-2 mb-8 overflow-x-auto pb-2 flex-nowrap border-b border-[#ddc0bf] pt-4"></div>
        
        <div id="admin-loading" class="text-center py-12 hidden">
          <span class="material-symbols-outlined text-[#6c131c] text-4xl animate-spin">progress_activity</span>
        </div>
        
        <!-- Contenedor Lista -->
        <div id="admin-grid" class="w-full flex flex-col"></div>
      </div>
    </main>

    <!-- MODAL: NUEVO/EDITAR PLATO -->
    <div id="itemModal" class="fixed inset-0 hidden items-center justify-center p-4 bg-black/40 z-50">
      <div class="w-full max-w-[760px] bg-[#faf8f5] border border-[#ddc0bf] shadow-2xl flex flex-col max-h-[95vh] overflow-hidden">
        <div class="px-6 py-4 border-b border-[#ddc0bf] flex justify-between items-center shrink-0">
          <h3 id="modal-title" class="font-display text-xl text-[#6c131c] uppercase tracking-wider">Añadir Nuevo Plato</h3>
          <button id="close-item-btn" class="text-gray-500 hover:text-black p-1"><span class="material-symbols-outlined pointer-events-none text-[20px]">close</span></button>
        </div>
        
        <form id="itemForm" class="flex flex-col flex-1 overflow-hidden">
          <input type="hidden" id="item-id" />
          <div class="p-6 overflow-y-auto flex-1 bg-[#fef8f3]">
            <div class="grid grid-cols-1 md:grid-cols-[1.5fr_1fr] gap-6 items-start h-full">
              
              <div class="flex flex-col gap-4">
                <div class="grid grid-cols-[1fr_2fr] gap-4">
                  <div class="flex flex-col gap-1">
                    <label class="text-[10px] font-bold text-[#6c131c] uppercase tracking-wider">Categoría</label>
                    <select id="item-categoria" class="w-full bg-white border border-[#ddc0bf] px-3 py-2 text-gray-900 focus:outline-none focus:border-[#6c131c] text-sm"></select>
                  </div>
                  <div class="flex flex-col gap-1">
                    <label class="text-[10px] font-bold text-[#6c131c] uppercase tracking-wider">Nombre del Plato</label>
                    <input id="item-nombre" required class="w-full bg-white border border-[#ddc0bf] px-3 py-2 text-gray-900 focus:outline-none focus:border-[#6c131c] text-sm" type="text"/>
                  </div>
                </div>
                
                <div class="flex items-start gap-4">
                  <div class="flex flex-col gap-1 w-32 shrink-0">
                    <label class="text-[10px] font-bold text-[#6c131c] uppercase tracking-wider">Precio</label>
                    <input id="item-precio" required class="w-full bg-white border border-[#ddc0bf] px-3 py-2 text-gray-900 focus:outline-none focus:border-[#6c131c] text-sm" type="number"/>
                  </div>
                  <div class="flex flex-col gap-1 flex-1">
                    <label class="text-[10px] font-bold text-[#6c131c] uppercase tracking-wider">Descripción</label>
                    <textarea id="item-descripcion" rows="2" maxlength="300" class="w-full bg-white border border-[#ddc0bf] px-3 py-2 text-gray-900 focus:outline-none focus:border-[#6c131c] resize-none text-sm min-h-[44px]"></textarea>
                  </div>
                </div>
                
                <div class="flex items-center gap-6 py-2">
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input id="item-picante" type="checkbox" class="h-4 w-4 rounded-none border-[#ddc0bf] text-[#6c131c]"/>
                    <span class="text-xs text-gray-600 uppercase tracking-wider">Es Picante</span>
                  </label>
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input id="item-pausado" type="checkbox" class="h-4 w-4 rounded-none border-[#ddc0bf] text-red-500"/>
                    <span class="text-xs text-gray-600 uppercase tracking-wider">Pausar Plato</span>
                  </label>
                </div>
                
                <div class="flex flex-col gap-1">
                  <label class="text-[10px] font-bold text-[#6c131c] uppercase tracking-wider">Imagen</label>
                  <input id="item-file-input" type="file" accept="image/jpeg, image/png, image/webp" class="w-full bg-white border border-[#ddc0bf] px-2 py-1 text-gray-500 text-xs file:mr-4 file:py-1.5 file:px-4 file:border-0 file:bg-[#6c131c] file:text-white cursor-pointer"/>
                  <input type="hidden" id="item-imagen-url" />
                </div>
              </div>
              
              <div class="flex items-center justify-center w-full h-full pt-4 md:pt-0">
                 <div id="preview-container" class="w-full pointer-events-none border border-dashed border-[#ddc0bf] p-2 bg-white"></div>
              </div>
              
            </div>
          </div>
          <div class="px-6 py-4 border-t border-[#ddc0bf] bg-[#faf8f5] flex justify-end items-center gap-3 shrink-0">
            <button type="button" id="cancel-item-btn" class="px-5 py-2 font-display text-sm text-gray-600 hover:text-black">Cancelar</button>
            <button id="submit-btn" type="submit" class="px-6 py-2 font-display text-sm bg-[#6c131c] text-white hover:bg-[#8b2b30]">Guardar Plato</button>
          </div>
        </form>
      </div>
    </div>
    
  </div>
      <!-- MODAL: CATEGORÍAS -->
    <div id="categoryModal" class="fixed inset-0 hidden items-center justify-center p-4 bg-black/40 z-50">
      <div class="w-full max-w-sm bg-[#faf8f5] border border-[#ddc0bf] shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
        <div class="px-6 py-4 border-b border-[#ddc0bf] flex justify-between items-center shrink-0">
          <h3 class="font-display text-xl text-[#6c131c] uppercase tracking-wider">Categorías</h3>
          <button id="close-cat-btn" class="text-gray-500 hover:text-black"><span class="material-symbols-outlined pointer-events-none">close</span></button>
        </div>
        <div class="p-6 overflow-y-auto space-y-4 flex-1">
          <form id="catForm" class="flex gap-2">
            <input id="new-cat-name" type="text" required class="flex-1 bg-white border border-[#ddc0bf] px-3 py-2 text-sm text-gray-900 focus:outline-none focus:border-[#6c131c]" placeholder="Nueva categoría..."/>
            <button type="submit" id="add-cat-btn" class="bg-[#6c131c] text-white px-4 py-2 font-display text-sm hover:bg-[#8b2b30]">+ Crear</button>
          </form>
          <div id="category-manage-list" class="space-y-2 text-sm"></div>
        </div>
      </div>
    </div>

    <!-- MODAL: BANNER PROMO -->
    <div id="promoConfigModal" class="fixed inset-0 hidden items-center justify-center p-4 bg-black/40 z-50">
      <div class="w-full bg-[#faf8f5] border border-[#ddc0bf] shadow-2xl flex flex-col overflow-hidden max-h-[95vh] max-w-[544px]">
        <div class="px-6 py-4 border-b border-[#ddc0bf] flex justify-between items-center shrink-0">
          <h3 class="font-display text-xl text-[#6c131c] uppercase tracking-wider flex items-center"><span class="material-symbols-outlined mr-2">campaign</span> Anuncio Frontal</h3>
          <button id="close-promo-btn" class="text-gray-500 hover:text-black"><span class="material-symbols-outlined pointer-events-none">close</span></button>
        </div>
        <div class="p-6 overflow-y-auto flex-1 flex flex-col gap-4 bg-[#fef8f3]">
          <div class="flex flex-col gap-4">
            <label class="flex items-center gap-3 cursor-pointer p-3 bg-white border border-[#ddc0bf] hover:border-[#6c131c] transition-colors">
              <input id="config-promo-activa" type="checkbox" class="h-4 w-4 rounded-none border-[#ddc0bf] text-[#6c131c]"/>
              <span class="font-display text-[#6c131c] text-sm uppercase tracking-wider">Activar Anuncio Pop-up</span>
            </label>
            <div class="flex flex-col gap-1">
              <label class="text-[10px] font-bold text-[#6c131c] uppercase tracking-wider">Texto del Anuncio</label>
              <textarea id="config-promo-texto" rows="2" class="w-full bg-white border border-[#ddc0bf] px-3 py-2 text-gray-900 focus:outline-none focus:border-[#6c131c] resize-none text-sm" placeholder="Escribe tu promoción aquí..."></textarea>
            </div>
            <div class="flex flex-col gap-1">
              <label class="text-[10px] font-bold text-[#6c131c] uppercase tracking-wider">Imagen del Anuncio</label>
              <input id="config-promo-file" type="file" accept="image/*" class="w-full bg-white border border-[#ddc0bf] px-2 py-1 text-gray-500 text-xs file:mr-4 file:py-1.5 file:px-4 file:border-0 file:bg-[#6c131c] file:text-white cursor-pointer"/>
              <input id="config-promo-img" type="hidden" />
            </div>
          </div>
          <div class="flex flex-col items-center justify-center bg-[#faf8f5] p-2 border border-[#ddc0bf] relative mt-2">
            <div class="relative bg-white overflow-hidden shrink-0 w-full" style="aspect-ratio: 512/192;">
              <img id="admin-preview-promo-img" src="" class="absolute inset-0 w-full h-full object-cover z-0" />
              <div class="absolute inset-0 flex z-20 pointer-events-none">
                <div class="w-[45%]"></div>
                <div class="flex flex-col justify-center items-end text-right p-4 w-[55%]">
                  <h3 class="font-display text-sm text-[#6c131c] uppercase mb-1">¡Novedad!</h3>
                  <p id="admin-preview-promo-texto" class="text-xs text-gray-800 leading-tight mb-2 line-clamp-3">El texto irá aquí...</p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="px-6 py-4 border-t border-[#ddc0bf] bg-[#faf8f5] flex justify-end gap-2 shrink-0">
          <button type="button" onclick="document.getElementById('promoConfigModal').classList.replace('flex','hidden')" class="px-5 py-2 font-display text-sm text-gray-600 hover:text-black">Cancelar</button>
          <button id="promo-save-btn" class="px-6 py-2 font-display text-sm bg-[#6c131c] text-white hover:bg-[#8b2b30]">Guardar Anuncio</button>
        </div>
      </div>
    </div>

    <!-- MODAL: GENERADOR QR -->
    <div id="qrModal" class="fixed inset-0 hidden items-center justify-center p-4 bg-black/40 z-50">
      <div class="w-full max-w-[850px] max-h-[95vh] bg-[#faf8f5] border border-[#ddc0bf] shadow-2xl flex flex-col overflow-hidden">
        <div class="px-6 py-4 border-b border-[#ddc0bf] flex justify-between items-center shrink-0">
          <h3 class="font-display text-xl text-[#6c131c] uppercase tracking-wider flex items-center"><span class="material-symbols-outlined mr-2">qr_code_scanner</span> Estudio QR</h3>
          <button id="close-qr-btn" class="text-gray-500 hover:text-black"><span class="material-symbols-outlined pointer-events-none">close</span></button>
        </div>
        <div class="flex flex-col md:flex-row flex-1 overflow-hidden bg-[#fef8f3]">
          <div class="w-full md:w-[55%] p-6 overflow-y-auto border-b md:border-b-0 md:border-r border-[#ddc0bf] space-y-4">
            <div class="bg-white border border-[#ddc0bf] p-4">
              <h4 class="font-display text-sm text-[#6c131c] uppercase mb-3">Datos</h4>
              <div class="space-y-3">
                <div><label class="text-[10px] text-gray-500 uppercase font-bold mb-1 block">URL</label><input id="qr-input-url" type="text" class="w-full bg-[#faf8f5] border border-[#ddc0bf] px-3 py-2 text-sm" value="https://demos-menus.pages.dev/la-trattoria/"/></div>
                <div><label class="text-[10px] text-gray-500 uppercase font-bold mb-1 block">Mesa</label><input id="qr-input-texto" type="text" class="w-full bg-[#faf8f5] border border-[#ddc0bf] px-3 py-2 text-sm" value="Mesa 1"/></div>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div class="bg-white border border-[#ddc0bf] p-4">
                <h4 class="font-display text-sm text-[#6c131c] uppercase mb-3">Colores</h4>
                <div class="flex justify-between">
                  <input type="color" id="qr-color-dots" value="#000000" class="w-8 h-8 cursor-pointer border-0 p-0">
                  <input type="color" id="qr-color-corners" value="#6c131c" class="w-8 h-8 cursor-pointer border-0 p-0">
                  <input type="color" id="qr-color-bg" value="#ffffff" class="w-8 h-8 cursor-pointer border-0 p-0">
                </div>
              </div>
              <div class="bg-white border border-[#ddc0bf] p-4">
                <h4 class="font-display text-sm text-[#6c131c] uppercase mb-3">Logo</h4>
                <input id="qr-input-file" type="file" accept="image/*" class="w-full text-xs"/>
              </div>
            </div>
          </div>
          <div class="w-full md:w-[45%] bg-white p-6 flex flex-col items-center justify-center border-l border-[#ddc0bf]">
            <div class="bg-white p-4 border border-[#ddc0bf] shadow-sm">
