<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="css/output.css" rel="stylesheet"/>
  <style>
    body { background-color: #FAF8F5; font-family: 'Lato', sans-serif; color: #2C2C2C; }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
    .editorial-card { border-bottom: 1px solid #D4CFC7; padding-bottom: 2rem; margin-bottom: 2rem; }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
  <div id="maintenance-overlay" class="fixed inset-0 bg-[#FAF8F5] z-[99999] flex-col items-center justify-center p-6 hidden">
    <h1 class="text-3xl font-serif text-[#B71C1C] mb-2">Servicio en Mantenimiento</h1>
    <p class="text-gray-600">Por favor, vuelve más tarde.</p>
  </div>

  <nav class="bg-[#FAF8F5] sticky top-0 border-b border-[#D4CFC7] z-40">
    <div class="flex flex-col items-center justify-center px-6 py-8 w-full max-w-4xl mx-auto">
      <div id="brand-title" class="text-3xl md:text-5xl font-serif tracking-widest text-[#111] uppercase mb-2">Cargando...</div>
      <a class="text-xs tracking-widest uppercase text-gray-500 hover:text-[#B71C1C]" href="#">Inicio</a>
    </div>
  </nav>

  <main class="flex-grow w-full max-w-4xl mx-auto px-6 py-12">
    <section class="text-center mb-16 border-b border-[#D4CFC7] pb-12">
      <h1 id="brand-slogan" class="text-2xl italic text-[#B71C1C] mb-4"></h1>
      <p id="brand-desc" class="text-gray-600 max-w-xl mx-auto leading-relaxed"></p>
    </section>

    <section class="mb-10">
      <div id="category-bar" class="flex flex-wrap gap-4 justify-center"></div>
    </section>

    <section class="mb-16">
      <h2 id="current-category-title" class="text-2xl font-serif italic text-center text-gray-800 mb-10"></h2>
      <div id="loading-spinner" class="text-center py-12"><p class="text-gray-400 italic">Cargando...</p></div>
      <div id="menu-grid" class="grid grid-cols-1 gap-12 hidden"></div>
    </section>
  </main>

  <div id="fab-container" class="fixed bottom-8 right-8 z-40 hidden">
    <button id="btn-open-cart" class="bg-[#B71C1C] text-white px-6 py-3 shadow-xl flex items-center gap-2 hover:bg-black transition-all">
      <span class="material-symbols-outlined">menu_book</span>
      <span class="font-serif uppercase tracking-wider text-sm">Mi Selección</span>
      <span id="fab-badge" class="bg-[#FAF8F5] text-[#B71C1C] px-2 py-0.5 rounded-full text-xs font-bold ml-1">0</span>
    </button>
  </div>

  <!-- Modales necesarios para que menu.js funcione -->
  <div id="order-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-[#FAF8F5] w-full max-w-md overflow-hidden flex flex-col max-h-[85vh] shadow-2xl">
      <div class="p-6 border-b border-[#D4CFC7] flex justify-between items-center">
        <h3 class="text-xl font-serif italic">Tu Selección</h3>
        <button id="btn-close-cart" class="text-gray-500 hover:text-black"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div id="modal-item-list" class="p-6 flex-grow overflow-y-auto space-y-4"></div>
      <div class="p-6 border-t border-[#D4CFC7] flex justify-between items-center gap-3">
        <button id="btn-clear-cart" class="text-[#B71C1C] font-serif italic text-sm">Limpiar</button>
        <button id="btn-close-cart-bottom" class="bg-black text-white px-6 py-2 font-serif text-sm uppercase">Cerrar</button>
      </div>
    </div>
  </div>
  
  <div id="footer-container"></div>
  <div id="clientePromoModal" class="fixed inset-0 hidden items-center justify-center z-[9999] bg-black/50 backdrop-blur-sm">
      <div class="bg-[#FAF8F5] p-6 max-w-md w-full border border-[#D4CFC7]" id="clientePromoContent">
          <img id="cliente-promo-img" src="" class="w-full mb-4 hidden" />
          <p id="cliente-promo-texto" class="text-gray-800 text-center mb-4 font-serif italic"></p>
          <button id="btn-entendido-promo" class="w-full bg-[#B71C1C] text-white py-2 font-serif">Entendido</button>
      </div>
  </div>

  <script type="module">
    import { footerHTML } from './js/configFooter.js';
    document.getElementById('footer-container').innerHTML = footerHTML;
  </script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/menu.js"></script>
</body>
</html>
