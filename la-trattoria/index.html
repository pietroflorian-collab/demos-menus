<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Digital - La Trattoria</title>
  
  <!-- Fuentes de Stitch (Playfair Display y Literata) -->
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind CDN y Configuración de Stitch -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6c131c',  'primary-container': '#8b2b30', secondary: '#635e55', surface: '#fef8f3',
            'surface-container': '#f3ede8', 'surface-container-low': '#f8f3ee',
            'on-surface': '#1d1b19', 'on-surface-variant': '#564241',
            'outline-variant': '#ddc0bf'
          },
          fontFamily: {
            'display': ['Playfair Display', 'serif'],
            'body': ['Literata', 'serif']
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Literata', serif; background-color: #fef8f3; color: #1d1b19; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-surface antialiased min-h-screen flex flex-col">

  <!-- HEADER FIJO -->
  <header class="fixed top-0 left-0 w-full z-50 bg-[#F4F1EA] shadow-sm h-24 border-b border-[#D6CDBF]">
    <div class="max-w-[1040px] mx-auto px-6 h-full flex items-center justify-between">
      <nav class="hidden md:flex gap-6 flex-1">
        <a class="text-xs uppercase tracking-widest text-gray-500 hover:text-primary transition" href="#">Historia</a>
        <a class="text-xs uppercase tracking-widest text-primary font-bold" href="#">Carta</a>
      </nav>
      <div class="flex flex-col items-center justify-center text-center">
        <span class="text-[10px] uppercase tracking-[0.3em] text-gray-500 mb-1">Antica Trattoria</span>
        <a id="brand-title" class="font-display text-3xl leading-none uppercase font-bold text-[#2C2A27] tracking-[0.2em]"></a>
      </div>
      <div class="flex items-center gap-6 flex-1 justify-end">
        <a class="text-xs uppercase tracking-widest text-gray-500 hover:text-primary transition" href="#">Reservas</a>
      </div>
    </div>
  </header>

  <main class="w-full pt-24 bg-surface min-h-screen">
    <div class="max-w-[1040px] mx-auto px-6 py-12">
      
      <!-- HERO SECTION -->
      <header class="text-center py-12 flex flex-col items-center border-b border-[#ddc0bf] mb-8">
        <div class="flex items-center justify-center gap-3 mb-4 text-primary">
          <span class="w-12 h-px bg-[#ddc0bf]"></span>
          <span class="font-display text-xl">❦</span>
          <span class="text-xs uppercase tracking-[0.25em] text-primary">Anno Domini</span>
          <span class="font-display text-xl">❦</span>
          <span class="w-12 h-px bg-[#ddc0bf]"></span>
        </div>
        <h1 id="brand-slogan" class="font-display text-4xl md:text-5xl italic text-primary leading-tight max-w-2xl mx-auto"></h1>
        <p id="brand-desc" class="text-base text-gray-600 max-w-xl mx-auto mt-4 leading-relaxed"></p>
      </header>

      <!-- CATEGORÍAS STICKY (Texto separado por puntos) -->
      <nav class="sticky top-24 z-30 w-full bg-[#fef8f3]/95 backdrop-blur-md py-4 mb-8 overflow-x-auto">
        <ul id="category-bar" class="flex items-center justify-start md:justify-center min-w-max gap-4 text-center">
          <!-- JS inyecta categorías aquí -->
        </ul>
      </nav>

      <!-- TÍTULO DE SECCIÓN DINÁMICO -->
      <div class="text-center mb-8">
        <span class="text-xs uppercase tracking-[0.2em] text-gray-500 mb-2 block">Selezione del Giorno</span>
        <h2 id="current-category-title" class="font-display text-3xl text-gray-900 uppercase tracking-[0.12em]"></h2>
        <div class="mt-2 flex items-center justify-center gap-2">
          <span class="w-8 h-px bg-[#ddc0bf]"></span>
          <span class="text-primary text-xs">❦</span>
          <span class="w-8 h-px bg-[#ddc0bf]"></span>
        </div>
      </div>

      <!-- LISTA DE PLATOS -->
      <section id="menu-grid" class="w-full mt-4 border-t border-[#ddc0bf] hidden">
        <!-- JS inyecta los platos aquí -->
      </section>
      
      <div id="loading-spinner" class="text-center py-12">
        <p class="text-gray-500 italic">Cargando la carta...</p>
      </div>

    </div>
  </main>

  <!-- BOTÓN FLOTANTE (FAB) EDITORIAL -->
  <aside id="fab-container" class="fixed bottom-6 right-6 z-40 hidden">
    <button id="btn-open-cart" class="bg-primary-container text-[#FDFBF7] px-6 py-3 rounded-none border border-primary flex items-center gap-4 hover:brightness-110 transition-all shadow-lg">
      <span id="cart-item-count" class="font-display italic text-lg">Mi Pedido (0)</span>
      <div class="h-5 w-px bg-gray-400/30"></div>
      <div class="flex items-center gap-2">
        <span class="text-[10px] uppercase tracking-wider opacity-70">Total</span>
        <span id="cart-total-price" class="font-display font-bold text-lg">$0</span>
      </div>
    </button>
  </aside>

  <!-- MODAL DEL CARRITO -->
  <div id="order-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 hidden opacity-0 transition-opacity">
    <div class="bg-[#fef8f3] text-gray-900 border border-[#ddc0bf] w-full max-w-md flex flex-col max-h-[85vh] shadow-2xl transform scale-95 transition-transform" id="modal-content">  
      <div class="p-6 border-b border-[#ddc0bf] flex justify-between items-center">
        <h3 class="font-display text-2xl text-primary italic">Tu Comanda</h3>
        <button id="btn-close-cart" class="text-gray-500 hover:text-black">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div id="modal-item-list" class="p-6 flex-grow overflow-y-auto space-y-4 bg-[#f8f3ee]">
        <!-- JS inyecta items del carrito -->
      </div>

      <div class="p-6 border-t border-[#ddc0bf] flex flex-col gap-3">
        <button id="btn-whatsapp-checkout" class="w-full bg-[#25D366] text-white py-3 font-display font-bold text-lg hover:bg-[#128C7E] transition-all flex items-center justify-center gap-2">
          <span class="material-symbols-outlined">whatsapp</span> Enviar Pedido
        </button>
        <button id="btn-clear-cart" class="w-full text-primary font-display italic text-sm py-2">Vaciar Comanda</button>
      </div>
    </div>
  </div>

  <!-- FOOTER (Se inyecta dinámicamente) -->
  <div id="footer-container" class="mt-12"></div>

  <script type="module">
    import { footerHTML } from './js/configFooter.js';
    document.getElementById('footer-container').innerHTML = footerHTML;
  </script>
  
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/ui-editorial.js"></script>
  <script type="module" src="js/menu.js"></script>
</body>
</html>
