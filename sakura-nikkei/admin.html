<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Administrador - Sakura Nikkei</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;800&family=Plus+Jakarta+Sans:wght@400&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#AD2020', surface: '#121212', 'surface-container': '#1a1a1a',
            'on-surface': '#e2e2e2', 'wasabi': '#ACC677'
          },
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], display: ['Anybody', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #121212; color: #e2e2e2; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 9999px; }
    .scroll-container { cursor: grab; user-select: none; }
    .scroll-container:active { cursor: grabbing; }
  </style>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/ui-sakura.js"></script>
  <script type="module" src="js/admin.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23AD2020'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' fill='white' text-anchor='middle'>S</text></svg>">
</head>

<body class="flex min-h-[100dvh] md:h-screen overflow-x-hidden md:overflow-hidden text-sm relative">

  <div id="login-overlay" class="hidden fixed inset-0 bg-[#121212] z-[100] flex items-center justify-center">
    <div class="bg-[#1a1a1a] p-8 rounded-2xl border border-gray-700 shadow-xl w-full max-w-sm">
      <div class="text-center mb-6">
        <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-red-900/30 flex justify-center items-center">
          <span class="material-symbols-outlined text-[#AD2020] text-3xl">lock</span>
        </div>
        <h2 class="font-display text-2xl text-white">Acceso Restringido</h2>
      </div>
      <form id="login-form" class="flex flex-col gap-4">
        <input type="email" id="login-email" placeholder="Correo electrónico" required class="p-3 rounded-lg bg-[#121212] border border-gray-700 text-white focus:outline-none focus:border-[#AD2020]">
        <input type="password" id="login-pass" placeholder="Contraseña" required class="p-3 rounded-lg bg-[#121212] border border-gray-700 text-white focus:outline-none focus:border-[#AD2020]">
        <button type="submit" id="login-btn" class="bg-[#AD2020] text-white font-semibold py-3 rounded-lg hover:bg-red-700 transition-colors">Ingresar</button>
      </form>
    </div>
  </div>

  <div id="admin-layout" class="w-full h-full flex flex-col md:flex-row flex-1">
    
    <nav class="hidden md:flex h-screen w-64 fixed left-0 top-0 bg-[#0a0a0a] border-r border-gray-800 flex-col p-4 z-40">
      <div class="mb-8 px-4 py-6 text-center border-b border-gray-800">
        <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-[#1a1a1a] border border-[#AD2020] flex items-center justify-center">
          <span class="material-symbols-outlined text-[#AD2020] text-3xl">restaurant</span>
        </div>
        <h1 id="admin-sidebar-title" class="font-display text-xl text-white tracking-wider uppercase">Sakura Nikkei</h1>
      </div>
      
      <div class="px-2 mb-6 shrink-0">
        <button id="nav-publish-btn" class="w-full bg-[#ACC677] text-black font-semibold text-sm py-3 rounded-xl shadow-md hover:bg-green-400 flex items-center justify-center gap-2 transition-all">
          <span class="material-symbols-outlined text-[18px]">cloud_upload</span> Publicar Menú
        </button>
      </div>

      <div class="flex-1 px-2 overflow-y-auto flex flex-col gap-2 pb-4">
        
        <div class="flex flex-col shrink-0">
          <button onclick="document.getElementById('menu-sub').classList.toggle('hidden'); this.querySelector('.chevron').classList.toggle('rotate-180');" class="w-full flex items-center justify-between px-4 py-3 hover:bg-[#1a1a1a] rounded-xl text-left group transition-colors">
            <div class="flex items-center pointer-events-none">
              <span class="material-symbols-outlined mr-3 text-gray-400 group-hover:text-[#AD2020]">inventory_2</span>
              <span class="font-semibold text-gray-300 group-hover:text-white">Catálogo</span>
            </div>
            <span class="material-symbols-outlined text-gray-500 chevron transition-transform duration-200 pointer-events-none">expand_more</span>
          </button>
          <div id="menu-sub" class="hidden flex-col gap-1 pl-10 mt-1 border-l border-gray-800 ml-6">
            <button id="nav-add-btn" class="w-full flex items-center px-4 py-2 text-gray-400 hover:text-[#ACC677] text-left">
              <span class="material-symbols-outlined mr-2 text-sm">add</span><span class="text-sm">Nuevo Plato</span>
            </button>
            <button id="nav-cat-btn" class="w-full flex items-center px-4 py-2 text-gray-400 hover:text-[#ACC677] text-left">
              <span class="material-symbols-outlined mr-2 text-sm">folder_managed</span><span class="text-sm">Categorías</span>
            </button>
          </div>
        </div>

        <div class="flex flex-col shrink-0">
          <button onclick="document.getElementById('marketing-sub').classList.toggle('hidden'); this.querySelector('.chevron').classList.toggle('rotate-180');" class="w-full flex items-center justify-between px-4 py-3 hover:bg-[#1a1a1a] rounded-xl text-left group transition-colors">
            <div class="flex items-center pointer-events-none">
              <span class="material-symbols-outlined mr-3 text-gray-400 group-hover:text-[#AD2020]">campaign</span>
              <span class="font-semibold text-gray-300 group-hover:text-white">Marketing</span>
            </div>
            <span class="material-symbols-outlined text-gray-500 chevron transition-transform duration-200 pointer-events-none">expand_more</span>
          </button>
          <div id="marketing-sub" class="hidden flex-col gap-1 pl-10 mt-1 border-l border-gray-800 ml-6">
            <button id="nav-promo-btn" class="w-full flex items-center px-4 py-2 text-gray-400 hover:text-[#ACC677] text-left">
              <span class="material-symbols-outlined mr-2 text-sm">loyalty</span><span class="text-sm">Banner Promo</span>
            </button>
            <button id="nav-qr-btn" class="w-full flex items-center px-4 py-2 text-gray-400 hover:text-[#ACC677] text-left">
              <span class="material-symbols-outlined mr-2 text-sm">qr_code_2</span><span class="text-sm">Generar QR</span>
            </button>
          </div>
        </div>

        <div class="flex flex-col shrink-0">
          <button onclick="document.getElementById('admin-sub').classList.toggle('hidden'); this.querySelector('.chevron').classList.toggle('rotate-180');" class="w-full flex items-center justify-between px-4 py-3 hover:bg-[#1a1a1a] rounded-xl text-left group transition-colors">
            <div class="flex items-center pointer-events-none">
              <span class="material-symbols-outlined mr-3 text-gray-400 group-hover:text-[#AD2020]">admin_panel_settings</span>
              <span class="font-semibold text-gray-300 group-hover:text-white">Sistema</span>
            </div>
            <span class="material-symbols-outlined text-gray-500 chevron transition-transform duration-200 pointer-events-none">expand_more</span>
          </button>
          <div id="admin-sub" class="hidden flex-col gap-1 pl-10 mt-1 border-l border-gray-800 ml-6">
            <button id="nav-emp-btn" class="w-full flex items-center px-4 py-2 text-gray-400 hover:text-[#ACC677] text-left">
              <span class="material-symbols-outlined mr-2 text-sm">manage_accounts</span><span class="text-sm">Personal</span>
            </button>
            <a class="w-full flex items-center px-4 py-2 text-gray-400 hover:text-[#ACC677] text-left" href="index.html?admin=true" target="_blank">
              <span class="material-symbols-outlined mr-2 text-sm">storefront</span><span class="text-sm">Ver Carta</span>
            </a>
          </div>
        </div>
        
        <button id="nav-logout-btn" class="w-full flex items-center px-4 py-3 mt-auto text-red-400 hover:bg-[#1a1a1a] rounded-xl text-left transition-colors shrink-0">
          <span class="material-symbols-outlined mr-3">logout</span><span class="font-semibold">Cerrar Sesión</span>
        </button>
      </div>
    </nav>

    <main class="flex-1 ml-0 md:ml-64 flex flex-col relative z-10 min-w-0 bg-[#121212]">
      
      <div class="md:hidden flex flex-col z-30 shrink-0">
        <div class="flex justify-between items-center px-4 py-3 bg-[#0a0a0a] border-b border-gray-800">
          <div class="flex items-center gap-3">
            <button onclick="document.getElementById('mobile-menu-overlay').classList.toggle('hidden')" class="p-2 text-gray-400 hover:bg-[#1a1a1a] rounded-lg">
              <span class="material-symbols-outlined pointer-events-none">menu</span>
            </button>
            <h1 class="text-lg font-bold text-white">Gestor</h1>
          </div>
          <button id="mobile-publish-btn" class="px-4 py-2 bg-[#ACC677] text-black font-semibold text-xs rounded-full shadow-sm">
            Publicar
          </button>
        </div>
      </div>

      <header class="px-8 py-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 shrink-0">
        <div>
          <h2 class="text-3xl font-display text-white tracking-tight">Tus Productos</h2>
          <p class="text-gray-400 mt-1">Ver, editar y organizar tus ofertas culinarias.</p>
        </div>
        <div class="flex items-center gap-4 w-full md:w-auto">
          <div class="relative w-full sm:w-80">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">search</span>
            <input id="admin-search-input" class="w-full bg-[#1a1a1a] border border-gray-700 rounded-full pl-11 pr-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-[#AD2020] text-sm shadow-sm" placeholder="Buscar por nombre..." type="text"/>
          </div>
        </div>
      </header>

      <div class="flex-1 md:overflow-y-auto px-8 pb-12 min-h-0 w-full">
        <div id="admin-category-bar" class="scroll-container flex gap-2 mb-8 overflow-x-auto pb-2 flex-nowrap"></div>
        
        <div id="admin-loading" class="text-center py-12 hidden">
          <span class="material-symbols-outlined text-[#AD2020] text-4xl animate-spin">progress_activity</span>
        </div>
        
        <div id="admin-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-6"></div>
      </div>
    </main>

    <div id="itemModal" class="fixed inset-0 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-sm z-50">
      <div class="w-full max-w-[760px] bg-[#1a1a1a] rounded-2xl border border-gray-700 shadow-2xl flex flex-col max-h-[95vh] overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-800 flex justify-between items-center shrink-0">
          <h3 id="modal-title" class="text-xl font-display text-white">Añadir Nuevo Plato</h3>
          <button id="close-item-btn" class="text-gray-400 hover:text-white bg-[#2a2a2a] hover:bg-[#333] p-2 rounded-full transition-colors"><span class="material-symbols-outlined pointer-events-none text-[20px]">close</span></button>
        </div>
        
        <form id="itemForm" class="flex flex-col flex-1 overflow-hidden">
          <input type="hidden" id="item-id" />
          <div class="p-6 overflow-y-auto flex-1 bg-[#121212]">
            <div class="grid grid-cols-1 md:grid-cols-[1.5fr_1fr] gap-6 items-start h-full">
              
              <div class="flex flex-col gap-4">
                <div class="grid grid-cols-[1fr_2fr] gap-4">
                  <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Categoría</label>
                    <select id="item-categoria" class="w-full bg-[#1a1a1a] border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-[#AD2020] text-sm"></select>
                  </div>
                  <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Nombre del Plato</label>
                    <input id="item-nombre" required class="w-full bg-[#1a1a1a] border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-[#AD2020] text-sm" type="text"/>
                  </div>
                </div>
                
                <div class="flex items-start gap-4">
                  <div class="flex flex-col gap-1.5 w-32 shrink-0">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Precio</label>
                    <input id="item-precio" required class="w-full bg-[#1a1a1a] border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-[#AD2020] text-sm" type="number"/>
                  </div>
                  <div class="flex flex-col gap-1.5 flex-1">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Descripción</label>
                    <textarea id="item-descripcion" rows="2" maxlength="300" class="w-full bg-[#1a1a1a] border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-[#AD2020] resize-none text-sm min-h-[44px]"></textarea>
                  </div>
                </div>
                
                <div class="flex items-center gap-6 py-2">
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input id="item-picante" type="checkbox" class="h-4 w-4 rounded border-gray-600 bg-[#1a1a1a] text-[#AD2020] focus:ring-[#AD2020]"/>
                    <span class="text-sm font-medium text-gray-300">Es Picante</span>
                  </label>
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input id="item-pausado" type="checkbox" class="h-4 w-4 rounded border-gray-600 bg-[#1a1a1a] text-red-500 focus:ring-red-500"/>
                    <span class="text-sm font-medium text-gray-300">Pausar Plato</span>
                  </label>
                </div>
                
                <div class="flex flex-col gap-1.5">
                  <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Imagen</label>
                  <input id="item-file-input" type="file" accept="image/jpeg, image/png, image/webp" class="w-full bg-[#1a1a1a] border border-gray-700 rounded-lg px-3 py-2 text-gray-400 text-sm file:mr-4 file:py-1.5 file:px-4 file:rounded-full file:border-0 file:bg-[#AD2020] file:text-white hover:file:bg-red-700 transition-colors cursor-pointer"/>
                  <input type="hidden" id="item-imagen-url" />
                </div>
              </div>
              
              <div class="flex items-center justify-center w-full h-full pt-4 md:pt-0">
                 <div id="preview-container" class="w-full pointer-events-none"></div>
              </div>
              
            </div>
          </div>
          <div class="px-6 py-4 border-t border-gray-800 bg-[#1a1a1a] flex justify-end items-center gap-3 shrink-0">
            <button type="button" id="cancel-item-btn" class="px-5 py-2.5 rounded-full font-medium text-sm text-gray-400 hover:text-white hover:bg-[#2a2a2a] transition-colors">Cancelar</button>
            <button id="submit-btn" type="submit" class="px-6 py-2.5 rounded-full font-semibold text-sm bg-[#AD2020] text-white shadow-md hover:bg-red-700 transition-colors">Guardar Plato</button>
          </div>
        </form>
      </div>
    </div>
    
  </div>
</body>
</html>
