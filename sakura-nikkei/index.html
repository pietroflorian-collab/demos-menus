  <script type="module">
    import { AppConfig } from './js/config.js';
    const baseUrl = (AppConfig.urls?.produccion || '').replace(/\/+$/, '');
    document.getElementById('meta-title').innerText = `${AppConfig.cliente.nombre} - Menú`;
    document.getElementById('og-title').content = `${AppConfig.cliente.nombre} - Menú`;
    document.getElementById('og-desc').content = AppConfig.cliente.descripcionComercial;
    document.getElementById('og-url').content = baseUrl ? `${baseUrl}/` : window.location.href;
    document.getElementById('og-image').content = baseUrl ? `${baseUrl}/images/logo1.png` : 'images/logo1.jpg';
    document.getElementById('brand-title').innerText = `${AppConfig.cliente.nombre} MENÚ`;
    document.getElementById('brand-slogan').innerText = AppConfig.cliente.eslogan;
    document.getElementById('brand-desc').innerText = AppConfig.cliente.descripcionComercial;
  </script>

  <style>
    body {
      background-image: url('images/bg-login.web');
      background-repeat: repeat;
    }
    button { border: none; outline: none; }
    .menu-card-img-wrapper { position: relative; overflow: hidden; width: 100%; aspect-ratio: 4/5; }
    @media (min-width: 640px) { .menu-card-img-wrapper { width: 40%; aspect-ratio: auto; min-height: 260px; } }
    .menu-card-img-wrapper img { transition: transform 0.3s ease; }
    .menu-card:hover .menu-card-img-wrapper img { transform: scale(1.05); }
    .glow-hover:hover { box-shadow: 0 0 15px var(--color-primary); }

             /* --- EFECTO FLUJO ELÉCTRICO SAKURA (CORREGIDO) --- */
    @keyframes rotar-energia {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes brillo-electrico {
      0%, 100% { box-shadow: 0 0 10px rgba(255, 0, 60, 0.2), 0 0 15px rgba(0, 240, 255, 0.1); }
      50% { box-shadow: 0 0 20px rgba(255, 0, 60, 0.4), 0 0 25px rgba(0, 240, 255, 0.3); }
    }

    .card-electrica {
      position: relative;
      border-radius: 0.75rem;
      background-color: #121212; 
      /* Animación de respiración de luz exterior */
      animation: brillo-electrico 4s ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    /* El flujo de energía (El tubo de neón) */
    .card-electrica::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: conic-gradient(
        transparent 0deg,
        transparent 180deg,
        rgba(0, 240, 255, 0.1) 220deg,
        #00f0ff 260deg,
        #ff003c 300deg,
        transparent 350deg
      );
      animation: rotar-energia 4s linear infinite;
      animation-delay: var(--delay, 0s);
      z-index: 0;
    }

    /* El fondo interior que tapa el centro y deja ver solo un borde de 2px */
    .card-electrica::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px; right: 2px; bottom: 2px;
      border-radius: calc(0.75rem - 2px);
      background-color: #121212; /* El mismo fondo oscuro */
      z-index: 1;
    }

    /* Aseguramos que el contenido esté por encima de la máscara */
    .card-electrica > * {
      position: relative;
      z-index: 2;
    }

    /* SALTO ELÉCTRICO (Retrasos distintos para cada tarjeta) */
    .card-electrica:nth-child(1) { --delay: 0s; }
    .card-electrica:nth-child(2) { --delay: -0.5s; }
    .card-electrica:nth-child(3) { --delay: -1s; }
    .card-electrica:nth-child(4) { --delay: -1.5s; }
    .card-electrica:nth-child(5) { --delay: -2s; }
    .card-electrica:nth-child(6) { --delay: -2.5s; }
    .card-electrica:nth-child(7) { --delay: -3s; }
    .card-electrica:nth-child(8) { --delay: -3.5s; }

  </style>

  
</head>
<body class="antialiased min-h-screen flex flex-col bg-surface text-on-surface relative">

  <div id="maintenance-overlay" class="fixed inset-0 bg-surface-container-lowest z-[99999] flex-col items-center justify-center p-6 hidden">

      </div>

    </div>

        </div>
        <div class="flex-1 flex justify-center items-center py-2 shrink-0">
          <img alt="Mascota" class="w-28 h-28 md:w-52 md:h-52 object-contain rebote-amplio" src="images/logo1.jpg"/>

    </section>

    <div id="order-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      if (urlParams.get('admin') === 'true') {

        backBtn.href = 'admin.html';
        backBtn.className = 'fixed bottom-6 left-6 z-[100] bg-surface-container-high text-primary font-promo-botones px-4 py-3 rounded-full shadow-2xl border border-primary/40 flex items-center gap-2 hover:bg-surface-bright transition-all active:scale-95';

        document.body.appendChild(backBtn);
