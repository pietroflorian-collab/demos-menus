<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Administrador - Green Bowl</title>
  
  <!-- Tailwind CDN y Fuentes de Stitch -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  
  <!-- Configuración de Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#005ab7', 
            surface: '#f9f9f9',
            'on-surface': '#1a1c1c',
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f9f9f9; color: #1a1c1c; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 9999px; }
    .scroll-container { cursor: grab; user-select: none; }
    .scroll-container:active { cursor: grabbing; }
  </style>

  <!-- Scripts Lógicos -->
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/admin.js"></script>
  <link rel="manifest" href="manifest-admin.json">
</head>

<body class="flex min-h-[100dvh] md:h-screen overflow-x-hidden md:overflow-hidden text-sm relative">

  <!-- OVERLAY LOGIN (Oculto por defecto en modo demo) -->
  <div id="login-overlay" class="hidden fixed inset-0 bg-white z-[100] flex items-center justify-center">
    <div class="bg-gray-50 p-8 rounded-2xl shadow-xl w-full max-w-sm border border-gray-200">
      <div class="text-center mb-6">
        <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-blue-100 flex justify-center items-center">
          <span class="material-symbols-outlined text-[#005ab7] text-3xl">lock</span>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">Acceso Restringido</h2>
      </div>
      <form id="login-form" class="flex flex-col gap-4">
        <input type="email" id="login-email" placeholder="Correo electrónico" required class="p-3 rounded-lg bg-white border border-gray-300 text-gray-900 outline-none focus:border-[#005ab7]">
        <input type="password" id="login-pass" placeholder="Contraseña" required class="p-3 rounded-lg bg-white border border-gray-300 text-gray-900 outline-none focus:border-[#005ab7]">
        <button type="submit" id="login-btn" class="bg-[#005ab7] text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition-colors">Ingresar</button>
      </form>
    </div>
  </div>

  <div id="admin-layout" class="w-full h-full flex flex-col md:flex-row flex-1">
    
    <!-- SIDEBAR (Menú Lateral Limpio) -->
    <nav class="hidden md:flex h-screen w-64 fixed left-0 top-0 bg-white border-r border-gray-200 flex-col p-4 z-40">
      <div class="mb-8 px-4 py-4 text-center">
        <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-gray-100 flex items-center justify-center">
          <span class="material-symbols-outlined text-gray-800 text-3xl">storefront</span>
        </div>
        <h1 class="text-lg font-bold text-gray-900 tracking-tight">Gestión de Menú</h1>
      </div>
      
      <!-- Botón Publicar -->
      <div class="px-2 mb-6 shrink-0">
        <button id="nav-publish-btn" class="w-full bg-[#34C759] text-white font-semibold text-sm py-3 rounded-xl shadow-md hover:bg-green-600 flex items-center justify-center gap-2 transition-all">
          <span class="material-symbols-outlined text-[18px]">cloud_upload</span> Publicar Menú
        </button>
      </div>

      <!-- Menú de Navegación -->
      <div class="flex-1 px-2 overflow-y-auto flex flex-col gap-2 pb-4">
        
        <!-- ACORDEÓN 1 -->
        <div class="flex flex-col shrink-0">
          <button onclick="document.getElementById('menu-sub').classList.toggle('hidden'); this.querySelector('.chevron').classList.toggle('rotate-180');" class="w-full flex items-center justify-between px-4 py-3 hover:bg-gray-100 rounded-xl text-left group transition-colors">
            <div class="flex items-center pointer-events-none">
              <span class="material-symbols-outlined mr-3 text-gray-500 group-hover:text-[#005ab7]">inventory_2</span>
              <span class="font-semibold text-gray-700 group-hover:text-gray-900">Catálogo</span>
            </div>
            <span class="material-symbols-outlined text-gray-400 chevron transition-transform duration-200 pointer-events-none">expand_more</span>
          </button>
          <div id="menu-sub" class="hidden flex-col gap-1 pl-10 mt-1">
            <button id="nav-add-btn" class="w-full flex items-center px-4 py-2 text-gray-500 hover:bg-gray-50 hover:text-[#005ab7] rounded-lg text-left">
              <span class="material-symbols-outlined mr-2 text-sm">add</span><span class="font-medium text-sm">Nuevo Plato</span>
            </button>
            <button id="nav-cat-btn" class="w-full flex items-center px-4 py-2 text-gray-500 hover:bg-gray-50 hover:text-[#005ab7] rounded-lg text-left">
              <span class="material-symbols-outlined mr-2 text-sm">folder_managed</span><span class="font-medium text-sm">Categorías</span>
            </button>
          </div>
        </div>

        <!-- ACORDEÓN 2 -->
        <div class="flex flex-col shrink-0">
          <button onclick="document.getElementById('marketing-sub').classList.toggle('hidden'); this.querySelector('.chevron').classList.toggle('rotate-180');" class="w-full flex items-center justify-between px-4 py-3 hover:bg-gray-100 rounded-xl text-left group transition-colors">
            <div class="flex items-center pointer-events-none">
              <span class="material-symbols-outlined mr-3 text-gray-500 group-hover:text-[#005ab7]">campaign</span>
              <span class="font-semibold text-gray-700 group-hover:text-gray-900">Marketing</span>
            </div>
            <span class="material-symbols-outlined text-gray-400 chevron transition-transform duration-200 pointer-events-none">expand_more</span>
          </button>
          <div id="marketing-sub" class="hidden flex-col gap-1 pl-10 mt-1">
            <button id="nav-promo-btn" class="w-full flex items-center px-4 py-2 text-gray-500 hover:bg-gray-50 hover:text-[#005ab7] rounded-lg text-left">
              <span class="material-symbols-outlined mr-2 text-sm">loyalty</span><span class="font-medium text-sm">Banner Promo</span>
            </button>
            <button id="nav-qr-btn" class="w-full flex items-center px-4 py-2 text-gray-500 hover:bg-gray-50 hover:text-[#005ab7] rounded-lg text-left">
              <span class="material-symbols-outlined mr-2 text-sm">qr_code_2</span><span class="font-medium text-sm">Generar QR</span>
            </button>
          </div>
        </div>

        <!-- ACORDEÓN 3 -->
        <div class="flex flex-col shrink-0">
          <button onclick="document.getElementById('admin-sub').classList.toggle('hidden'); this.querySelector('.chevron').classList.toggle('rotate-180');" class="w-full flex items-center justify-between px-4 py-3 hover:bg-gray-100 rounded-xl text-left group transition-colors">
            <div class="flex items-center pointer-events-none">
              <span class="material-symbols-outlined mr-3 text-gray-500 group-hover:text-[#005ab7]">admin_panel_settings</span>
              <span class="font-semibold text-gray-700 group-hover:text-gray-900">Sistema</span>
            </div>
            <span class="material-symbols-outlined text-gray-400 chevron transition-transform duration-200 pointer-events-none">expand_more</span>
          </button>
          <div id="admin-sub" class="hidden flex-col gap-1 pl-10 mt-1">
            <button id="nav-emp-btn" class="w-full flex items-center px-4 py-2 text-gray-500 hover:bg-gray-50 hover:text-[#005ab7] rounded-lg text-left">
              <span class="material-symbols-outlined mr-2 text-sm">manage_accounts</span><span class="font-medium text-sm">Personal</span>
            </button>
            <a class="w-full flex items-center px-4 py-2 text-gray-500 hover:bg-gray-50 hover:text-[#005ab7] rounded-lg text-left" href="index.html?admin=true" target="_blank">
              <span class="material-symbols-outlined mr-2 text-sm">storefront</span><span class="font-medium text-sm">Ver Carta</span>
            </a>
          </div>
        </div>
        
        <button id="nav-logout-btn" class="w-full flex items-center px-4 py-3 mt-auto text-red-500 hover:bg-red-50 rounded-xl text-left transition-colors shrink-0">
          <span class="material-symbols-outlined mr-3">logout</span><span class="font-semibold">Cerrar Sesión</span>
        </button>
      </div>
    </nav>

    <!-- ÁREA CENTRAL -->
    <main class="flex-1 ml-0 md:ml-64 flex flex-col relative z-10 min-w-0">
      
      <!-- Barra Superior Móvil -->
      <div class="md:hidden flex flex-col z-30 shrink-0">
        <div class="flex justify-between items-center px-4 py-3 bg-white border-b border-gray-200">
          <div class="flex items-center gap-3">
            <button onclick="document.getElementById('mobile-menu-overlay').classList.toggle('hidden')" class="p-2 text-gray-600 hover:bg-gray-100 rounded-lg">
              <span class="material-symbols-outlined pointer-events-none">menu</span>
            </button>
            <h1 class="text-lg font-bold text-gray-900">Gestor</h1>
          </div>
          <button id="mobile-publish-btn" class="px-4 py-2 bg-[#34C759] text-white font-semibold text-xs rounded-full shadow-sm">
            Publicar
          </button>
        </div>
      </div>

      <!-- HEADER (Escritorio) -->
      <header class="px-8 py-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 shrink-0">
        <div>
          <h2 class="text-3xl font-bold text-gray-900 tracking-tight">Tus Productos</h2>
          <p class="text-gray-500 mt-1">Ver, editar y organizar tus ofertas culinarias.</p>
        </div>
        <div class="flex items-center gap-4 w-full md:w-auto">
          <div class="relative w-full sm:w-80">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">search</span>
            <input id="admin-search-input" class="w-full bg-white border border-gray-200 rounded-full pl-11 pr-4 py-2.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#005ab7] focus:border-transparent text-sm shadow-sm" placeholder="Buscar por nombre..." type="text"/>
          </div>
        </div>
      </header>

      <!-- GRILLA DE PRODUCTOS -->
      <div class="flex-1 md:overflow-y-auto px-8 pb-12 min-h-0 w-full">
        <!-- Categorías -->
        <div id="admin-category-bar" class="scroll-container flex gap-2 mb-8 overflow-x-auto pb-2 flex-nowrap"></div>
        
        <div id="admin-loading" class="text-center py-12 hidden">
          <span class="material-symbols-outlined text-[#005ab7] text-4xl animate-spin">progress_activity</span>
        </div>
        
        <div id="admin-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>
    </main>

    <!-- MODAL: NUEVO/EDITAR PLATO -->
    <div id="itemModal" class="fixed inset-0 hidden items-center justify-center p-4 bg-black/40 backdrop-blur-sm z-50">
      <div class="w-full max-w-[760px] bg-white rounded-3xl shadow-2xl flex flex-col max-h-[95vh] overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-white shrink-0">
          <h3 id="modal-title" class="text-xl font-bold text-gray-900">Añadir Nuevo Plato</h3>
          <button id="close-item-btn" class="text-gray-400 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 p-2 rounded-full transition-colors"><span class="material-symbols-outlined pointer-events-none text-[20px]">close</span></button>
        </div>
        
        <form id="itemForm" class="flex flex-col flex-1 overflow-hidden">
          <input type="hidden" id="item-id" />
          <div class="p-6 overflow-y-auto flex-1 bg-gray-50/50">
            <div class="grid grid-cols-1 md:grid-cols-[1.5fr_1fr] gap-6 items-start h-full">
              
              <div class="flex flex-col gap-4">
                <div class="grid grid-cols-[1fr_2fr] gap-4">
                  <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Categoría</label>
                    <select id="item-categoria" class="w-full bg-white border border-gray-200 rounded-lg px-4 py-2.5 text-gray-900 focus:outline-none focus:border-[#005ab7] text-sm shadow-sm"></select>
                  </div>
                  <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Nombre del Plato</label>
                    <input id="item-nombre" required class="w-full bg-white border border-gray-200 rounded-lg px-4 py-2.5 text-gray-900 focus:outline-none focus:border-[#005ab7] text-sm shadow-sm" type="text"/>
                  </div>
                </div>
                
                <div class="flex items-start gap-4">
                  <div class="flex flex-col gap-1.5 w-32 shrink-0">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Precio</label>
                    <input id="item-precio" required class="w-full bg-white border border-gray-200 rounded-lg px-4 py-2.5 text-gray-900 focus:outline-none focus:border-[#005ab7] text-sm shadow-sm" type="number"/>
                  </div>
                  <div class="flex flex-col gap-1.5 flex-1">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Descripción</label>
                    <textarea id="item-descripcion" rows="2" maxlength="300" class="w-full bg-white border border-gray-200 rounded-lg px-4 py-2.5 text-gray-900 focus:outline-none focus:border-[#005ab7] resize-none text-sm shadow-sm min-h-[44px]"></textarea>
                  </div>
                </div>
                
                <div class="flex items-center gap-6 py-2">
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input id="item-picante" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-[#005ab7] focus:ring-[#005ab7]"/>
                    <span class="text-sm font-medium text-gray-700">Es Picante</span>
                  </label>
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input id="item-pausado" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-red-500 focus:ring-red-500"/>
                    <span class="text-sm font-medium text-gray-700">Pausar Plato</span>
                  </label>
                </div>
                
                <div class="flex flex-col gap-1.5">
                  <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Imagen</label>
                  <input id="item-file-input" type="file" accept="image/jpeg, image/png, image/webp" class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2 text-gray-500 text-sm file:mr-4 file:py-1.5 file:px-4 file:rounded-full file:border-0 file:bg-blue-50 file:text-[#005ab7] hover:file:bg-blue-100 transition-colors cursor-pointer shadow-sm"/>
                  <input type="hidden" id="item-imagen-url" />
                </div>
                
                <div class="pt-4 border-t border-gray-200 flex flex-col gap-3">
                  <div class="flex flex-col"><label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Días Promoción</label></div>
                  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;" class="text-xs">
                    <label class="flex items-center justify-center gap-1.5 cursor-pointer bg-white p-2 rounded-lg border border-gray-200 hover:border-[#005ab7]"><input type="checkbox" name="promo-dia" value="Lunes" class="h-3.5 w-3.5 rounded text-[#005ab7]"/>Lun</label>
                    <label class="flex items-center justify-center gap-1.5 cursor-pointer bg-white p-2 rounded-lg border border-gray-200 hover:border-[#005ab7]"><input type="checkbox" name="promo-dia" value="Martes" class="h-3.5 w-3.5 rounded text-[#005ab7]"/>Mar</label>
                    <label class="flex items-center justify-center gap-1.5 cursor-pointer bg-white p-2 rounded-lg border border-gray-200 hover:border-[#005ab7]"><input type="checkbox" name="promo-dia" value="Miércoles" class="h-3.5 w-3.5 rounded text-[#005ab7]"/>Mié</label>
                    <label class="flex items-center justify-center gap-1.5 cursor-pointer bg-white p-2 rounded-lg border border-gray-200 hover:border-[#005ab7]"><input type="checkbox" name="promo-dia" value="Jueves" class="h-3.5 w-3.5 rounded text-[#005ab7]"/>Jue</label>
                    <label class="flex items-center justify-center gap-1.5 cursor-pointer bg-white p-2 rounded-lg border border-gray-200 hover:border-[#005ab7]"><input type="checkbox" name="promo-dia" value="Viernes" class="h-3.5 w-3.5 rounded text-[#005ab7]"/>Vie</label>
                    <label class="flex items-center justify-center gap-1.5 cursor-pointer bg-white p-2 rounded-lg border border-gray-200 hover:border-[#005ab7]"><input type="checkbox" name="promo-dia" value="Sábado" class="h-3.5 w-3.5 rounded text-[#005ab7]"/>Sáb</label>
                    <label class="flex items-center justify-center gap-1.5 cursor-pointer bg-white p-2 rounded-lg border border-gray-200 hover:border-[#005ab7]"><input type="checkbox" name="promo-dia" value="Domingo" class="h-3.5 w-3.5 rounded text-[#005ab7]"/>Dom</label>
                  </div>
                  <div class="flex flex-col gap-1.5 mt-2">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Texto del Beneficio</label>
                    <input id="item-promo-texto" maxlength="35" class="w-full bg-white border border-gray-200 rounded-lg px-4 py-2.5 text-gray-900 focus:outline-none focus:border-[#005ab7] text-sm shadow-sm" type="text"/>
                  </div>
                </div>
              </div>
              
              <div class="flex items-center justify-center w-full h-full pt-4 md:pt-0">
                 <div id="preview-container" class="w-full pointer-events-none"></div>
              </div>
              
            </div>
          </div>
          <div class="px-6 py-4 border-t border-gray-100 bg-white flex justify-end items-center gap-3 shrink-0">
            <button type="button" id="cancel-item-btn" class="px-5 py-2.5 rounded-full font-medium text-sm text-gray-600 hover:bg-gray-100 transition-colors">Cancelar</button>
            <button id="submit-btn" type="submit" class="px-6 py-2.5 rounded-full font-semibold text-sm bg-[#005ab7] text-white shadow-md hover:bg-blue-700 transition-colors">Guardar Plato</button>
          </div>
        </form>
      </div>
    </div>

    <!-- OTROS MODALES (Se asume que están limpios de Sukidesu y con el mismo estilo claro) -->
    
  </div>
</body>
</html>
