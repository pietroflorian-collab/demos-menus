<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Digital - Green Bowl</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2E7D32', // Verde principal
            'primary-light': '#E8F5E9', // Verde claro de fondo
            'primary-container': '#A5D6A7', // Verde intermedio
            surface: '#FFFFFF',
            'bg-main': '#F4F9F4', // Fondo general
            'on-surface': '#1A1C1C',
            'on-surface-variant': '#5C6B5D',
            danger: '#D32F2F'
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F4F9F4; color: #1A1C1C; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Animación para el modal */
    .modal-enter { opacity: 1 !important; }
    .modal-enter #modal-content { transform: scale(1) !important; }
  </style>
</head>
<body class="bg-bg-main antialiased min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- HEADER MINIMALISTA -->
  <header class="absolute top-0 w-full z-50 h-16">
    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-full">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-3xl">eco</span>
        <span class="text-xl font-bold tracking-tight text-primary" id="brand-title">Green Bowl</span>
      </div>
      <nav class="hidden md:flex items-center gap-6">
        <a class="text-sm font-medium text-primary" href="#">Inicio</a>
      </nav>
    </div>
  </header>

  <!-- HERO SECTION -->
  <main class="w-full flex-grow">
    <section class="relative w-full bg-primary-light pt-28 pb-16 rounded-b-[40px] overflow-hidden px-6">
      <!-- Hojas decorativas de fondo -->
      <div class="absolute top-10 left-[-20px] text-primary-container opacity-30 transform -rotate-45 pointer-events-none">
        <span class="material-symbols-outlined text-[120px]">eco</span>
      </div>
      <div class="absolute bottom-10 right-[-20px] text-primary-container opacity-30 transform rotate-45 pointer-events-none">
        <span class="material-symbols-outlined text-[120px]">eco</span>
      </div>

      <!-- LOGO EN LA ESQUINA SUPERIOR DERECHA -->
      <img src="./images/logo.jpg" 
           alt="Training Athletic Club Logo" 
           class="absolute top-6 right-6 md:top-8 md:right-10 w-16 md:w-24 h-auto object-contain drop-shadow-md z-20">

      <!-- Contenedor principal del Hero -->
      <div class="max-w-md mx-auto md:max-w-5xl flex flex-col md:flex-row items-center relative z-10">
        <div class="md:w-2/3 lg:w-1/2 text-center md:text-left mb-8 md:mb-0">
          <h1 id="brand-slogan" class="text-4xl md:text-5xl font-extrabold tracking-tight text-primary mb-4 leading-tight">
            Fresh Your<br/>Green Bowl
          </h1>
          <p id="brand-desc" class="text-sm md:text-base text-on-surface-variant mb-6 max-w-sm mx-auto md:mx-0">
            Descubre nuestra selección de platos frescos y saludables preparados con los mejores ingredientes.
          </p>
          <button onclick="document.getElementById('menu-grid').scrollIntoView({behavior: 'smooth'})" class="bg-primary text-white px-8 py-3 rounded-full font-semibold shadow-lg hover:bg-green-800 transition-colors">
            Ordenar Ahora
          </button>
        </div>
      </div>
    </section>

    <!-- BARRA DE CATEGORÍAS -->
    <nav class="sticky top-0 z-30 w-full bg-bg-main/90 backdrop-blur-md py-6">
      <div id="category-bar" class="max-w-5xl mx-auto px-6 flex items-start gap-6 overflow-x-auto no-scrollbar">
        <!-- JS inyectará las categorías -->
      </div>
    </nav>

    <!-- SECCIÓN DE PRODUCTOS -->
    <section class="w-full max-w-6xl mx-auto px-4 py-6 mb-24">
      <div class="flex items-baseline justify-between mb-6 px-2 md:px-0">
        <h2 id="current-category-title" class="text-2xl font-bold text-primary tracking-tight">Freshing Items</h2>
      </div>
      
      <div id="loading-spinner" class="text-center py-12">
        <p class="text-on-surface-variant animate-pulse">Cargando menú...</p>
      </div>
      
      <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
        <!-- JS inyecta los platos aquí -->
      </div>
    </section>
  </main>

  <!-- BOTÓN FLOTANTE (FAB) PEQUEÑO Y DISCRETO -->
  <aside id="fab-container" class="fixed bottom-6 right-6 z-40 hidden">
    <button id="btn-open-cart" class="bg-primary text-white px-5 py-3 rounded-full flex items-center justify-center gap-2 hover:bg-green-800 transition-all shadow-xl shadow-green-900/30">
      <span class="material-symbols-outlined text-lg">shopping_bag</span>
      <span class="font-bold text-sm">Mi Lista (<span id="cart-item-count">0</span>)</span>
    </button>
  </aside>

  <!-- MODAL DEL CARRITO -->
  <div id="order-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
    <div class="bg-surface text-gray-900 rounded-[32px] w-full max-w-md flex flex-col max-h-[85vh] shadow-2xl transform scale-95 transition-transform duration-300" id="modal-content">   
      
      <!-- Cabecera del Modal -->
      <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-white rounded-t-[32px]">
        <h3 class="text-xl font-bold text-primary flex items-center gap-2">
          <span class="material-symbols-outlined">shopping_bag</span> Tu Pedido
        </h3>
        <button id="btn-close-cart" class="text-gray-400 hover:text-danger transition-colors bg-gray-50 rounded-full p-2">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <!-- Lista de Items -->
      <div id="modal-item-list" class="p-6 flex-grow overflow-y-auto space-y-4 bg-bg-main">
        <!-- JS inyecta items del carrito -->
      </div>

      <!-- Pie del Modal (Total y Botones) -->
      <div class="p-6 bg-white border-t border-gray-100 rounded-b-[32px] flex flex-col gap-3">
        
        <!-- Sección del Total a Pagar -->
        <div class="flex justify-between items-center mb-1 px-1">
          <span class="text-sm font-bold text-gray-500 uppercase tracking-wide">Total a Pagar</span>
          <span id="modal-total-price" class="text-2xl font-extrabold text-primary">$0</span>
        </div>

        <!-- Botón de WhatsApp (Tamaño controlado y estético) -->
        <button id="btn-whatsapp-checkout" class="w-full bg-[#25D366] text-white py-3.5 rounded-2xl font-bold text-sm hover:bg-[#128C7E] transition-all flex items-center justify-center gap-2 shadow-sm">
          <span class="material-symbols-outlined text-lg">whatsapp</span> Enviar Pedido por WhatsApp
        </button>
        
        <!-- Botón de Vaciar Lista -->
        <button id="btn-clear-cart" class="w-full text-gray-400 font-medium text-xs py-2 hover:text-danger transition-colors">
          Vaciar Lista
        </button>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>
  
  <!-- Scripts base -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('admin') === 'true') {
        const backBtn = document.createElement('a');
        backBtn.href = 'admin.html';
        backBtn.className = 'fixed bottom-6 left-6 z-[100] bg-white text-primary font-bold px-4 py-3 rounded-full shadow-2xl border border-gray-200 flex items-center gap-2 hover:bg-gray-100 transition-all active:scale-95';
        backBtn.innerHTML = '<span class="material-symbols-outlined text-xl pointer-events-none">arrow_back</span><span class="pointer-events-none">Volver al Gestor</span>';
        document.body.appendChild(backBtn);
      }
    });
  </script>

  <script type="module">
    import { footerHTML } from './js/configFooter.js';
    document.getElementById('footer-container').innerHTML = footerHTML;
  </script>

  <!-- Tus scripts lógicos -->
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/ui-minimal.js"></script>
  <script type="module" src="js/menu.js"></script>
</body>
</html>
