<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Digital</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1d1d1f', 'primary-container': '#8b2b30', 'secondary': '#005ab7', 'surface': '#f9f9f9',
            'surface-container-lowest': '#ffffff', 'surface-container': '#eeeeee',
            'on-surface': '#1a1c1c', 'on-surface-variant': '#46464a',
            'on-secondary': '#ffffff', 'on-primary': '#ffffff'
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f9f9f9; color: #1a1c1c; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-surface antialiased min-h-screen flex flex-col">

  <header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl shadow-sm h-16">
    <div class="max-w-7xl mx-auto px-4 md:px-8 flex items-center justify-between h-full">
      <div class="flex items-center gap-3">
        <!-- Vacío para que JS lo llene -->
        <span class="text-xl font-semibold tracking-tight text-primary" id="brand-title"></span>
      </div>
      <nav class="hidden md:flex items-center gap-6">
        <a class="text-sm font-medium text-primary" href="#">Inicio</a>
      </nav>
    </div>
  </header>

  <main class="w-full pt-16 min-h-screen">
    <section class="w-full py-16 text-center px-4 bg-surface">
      <div class="max-w-3xl mx-auto flex flex-col items-center">
        <h1 id="brand-slogan" class="text-4xl md:text-5xl font-bold tracking-tight text-primary mb-4"></h1>
        <p id="brand-desc" class="text-lg text-on-surface-variant max-w-xl mx-auto"></p>
      </div>
    </section>

    <nav class="sticky top-16 z-30 w-full bg-white/90 backdrop-blur-md py-4 shadow-sm">
      <div id="category-bar" class="max-w-5xl mx-auto px-4 flex items-center gap-3 overflow-x-auto no-scrollbar">
        <!-- JS inyecta categorías aquí -->
      </div>
    </nav>

    <section class="w-full max-w-5xl mx-auto px-4 py-10 mb-20">
      <div class="flex items-baseline justify-between mb-8">
        <h2 id="current-category-title" class="text-2xl font-bold text-primary tracking-tight"></h2>
      </div>
      
      <div id="loading-spinner" class="text-center py-12">
        <p class="text-on-surface-variant">Cargando menú...</p>
      </div>
      
      <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8 hidden">
        <!-- JS inyecta platos aquí -->
      </div>
    </section>
  </main>

  <div id="fab-container" class="fixed bottom-8 right-8 z-40 hidden">
    <button id="btn-open-cart" class="rounded-full px-6 py-3.5 shadow-xl flex items-center gap-3 bg-secondary text-white font-semibold transition-transform duration-200 hover:scale-105 active:scale-95">
      <span class="material-symbols-outlined text-[20px]">shopping_bag</span>
      <span>Ver mi lista</span>
      <span id="fab-badge" class="w-6 h-6 rounded-full bg-white text-secondary font-bold text-xs flex items-center justify-center">0</span>
    </button>
  </div>

  <div id="order-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 hidden opacity-0 transition-opacity">
   <div class="bg-[#fef8f3] text-gray-900 border border-[#ddc0bf] w-full max-w-md flex flex-col max-h-[85vh] shadow-2xl transform scale-95 transition-transform" id="modal-content">
      
      <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-white">
        <h3 class="text-xl font-bold text-primary flex items-center gap-2">
          <span class="material-symbols-outlined">shopping_bag</span> Tu Pedido
        </h3>
        <button id="btn-close-cart" class="text-gray-400 hover:text-gray-900 transition-colors">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div id="modal-item-list" class="p-5 flex-grow overflow-y-auto space-y-4 bg-surface">
        <!-- JS inyecta items del carrito -->
      </div>

      <div class="p-5 bg-white border-t border-gray-100 flex flex-col gap-3">
        <button id="btn-whatsapp-checkout" class="w-full bg-[#25D366] text-white py-3.5 rounded-full font-bold text-lg hover:bg-[#128C7E] transition-all flex items-center justify-center gap-2 shadow-lg">
          <span class="material-symbols-outlined">whatsapp</span> Pedir por WhatsApp
        </button>
        <button id="btn-clear-cart" class="w-full text-red-500 font-medium text-sm py-2">Limpiar Lista</button>
      </div>
    </div>
  </div>
  <!-- ... (tu modal de la lista termina aquí) ... -->
  </div>

  <!-- AGREGA ESTAS LÍNEAS AQUÍ -->
  <div id="footer-container"></div>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('admin') === 'true') {
        const backBtn = document.createElement('a');
        backBtn.href = 'admin.html';
        backBtn.className = 'fixed bottom-6 left-6 z-[100] bg-surface-container-high text-primary font-bold px-4 py-3 rounded-full shadow-2xl border border-gray-200 flex items-center gap-2 hover:bg-gray-100 transition-all active:scale-95';
        backBtn.innerHTML = '<span class="material-symbols-outlined text-xl pointer-events-none">arrow_back</span><span class="pointer-events-none">Volver al Gestor</span>';
        document.body.appendChild(backBtn);
      }
    });
  </script>

  <script type="module">
    import { footerHTML } from './js/configFooter.js';
    document.getElementById('footer-container').innerHTML = footerHTML;
  </script>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/ui-minimal.js"></script>
  <script type="module" src="js/menu.js"></script>
</body>
</html>
